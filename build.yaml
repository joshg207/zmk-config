### AURORA SOFLE END ###
########################

################################
### Prospector_Scanner Start ###
################################
  # Scanner - Non-Touch Mode (display only, no swipe navigation)
  #- board: xiao_ble/nrf52840/zmk
  - board: xiao_ble/nrf52840/zmk
    shield: prospector_scanner
    artifact-name: prospector_scanner

  # Scanner - Touch Mode (swipe navigation + settings screens)
  #- board: xiao_ble/nrf52840/zmk
  - board: xiao_ble/nrf52840/zmk
    shield: prospector_scanner
    cmake-args: -DEXTRA_CONF_FILE="$(pwd)/config/prospector_scanner_touch.conf"
    artifact-name: prospector_scanner_touch
##############################
### Prospector_Scanner End ###
##############################


############################
### SETTINGS_RESET START ###
############################

  - board: nice_nano
    shield: settings_reset
    artifact-name: nice_settings_reset

  - board: xiao_ble/nrf52840/zmk
    shield: settings_reset
    artifact-name: xiao_settings_reset

##########################
### SETTINGS_RESET END ###
##########################
