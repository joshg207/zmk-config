############################
### AURORA SOFLE START ###
############################

  # peripheral_right
  - board: nice_nano
    shield: splitkb_aurora_sofle_right oled_adapter_pro_micro_128x32
    cmake-args: -DCONFIG_ZMK_SLEEP=y -DCONFIG_ZMK_IDLE_TIMEOUT=60000 -DCONFIG_ZMK_RGB_UNDERGLOW=y -DCONFIG_ZMK_DISPLAY=y -DCONFIG_EC11=y -DCONFIG_EC11_TRIGGER_GLOBAL_THREAD=y -DCONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y
    artifact-name: nice_sofle_right

  # peripheral_left
  - board: nice_nano
    shield: splitkb_aurora_sofle_left_peripheral oled_adapter_pro_micro_128x32
    cmake-args: -DCONFIG_ZMK_SLEEP=y -DCONFIG_ZMK_IDLE_TIMEOUT=60000 -DCONFIG_ZMK_RGB_UNDERGLOW=y -DCONFIG_ZMK_DISPLAY=y -DCONFIG_EC11=y -DCONFIG_EC11_TRIGGER_GLOBAL_THREAD=y -DCONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y
    artifact-name: nice_sofle_left_peripheral

  # Xiao_Dongle
