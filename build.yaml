---
include:
  # ============ Corne Split Keyboard ============
  - board: nice_nano
    shield: corne_left_peripheral nice_view_adapter nice_view
    artifact-name: corne_left

  - board: nice_nano
    shield: corne_right_peripheral nice_view_adapter nice_view
    artifact-name: corne_right

  - board: seeeduino_xiao_ble
    shield: corne_dongle_xiao
    artifact-name: corne_dongle
    cmake-args:
      - -DCONFIG_ZMK_KEYBOARD_NAME=\"corne_dongle\"
      - -DCONFIG_ZMK_STUDIO=y
      - -DCONFIG_ZMK_STUDIO_LOCKING=n
      - -DCONFIG_ZMK_IDLE_TIMEOUT=60000
      - -DCONFIG_ZMK_USB=y
      - -DCONFIG_ZMK_BLE=y
    snippet: studio-rpc-usb-uart

  # ============ Lily58 Split Keyboard ============
  - board: nice_nano
    shield: lily58_left_peripheral
    artifact-name: lily58_left
    cmake-args:
      - -DCONFIG_ZMK_SLEEP=y
      - -DCONFIG_ZMK_IDLE_TIMEOUT=60000

  - board: nice_nano
    shield: lily58_right_peripheral
    artifact-name: lily58_right
    cmake-args:
      - -DCONFIG_ZMK_SLEEP=y
      - -DCONFIG_ZMK_IDLE_TIMEOUT=60000

  # ============ Aurora Sofle Split Keyboard ============
  - board: nice_nano@2
    shield: splitkb_aurora_sofle_left
    artifact-name: sofle_left

  - board: nice_nano@2
    shield: splitkb_aurora_sofle_right
    artifact-name: sofle_right

  # ============ Prospector Scanner Keyboard ============
  - board: xiao_ble/nrf52840/zmk
    shield: prospector_scanner
    artifact-name: prospector_scanner

  - board: xiao_ble/nrf52840/zmk
    shield: prospector_scanner
    artifact-name: prospector_scanner_touch
    cmake-args:
      - -DEXTRA_CONF_FILE="$(pwd)/config/prospector_scanner_touch.conf"

  # ============ Settings Reset Utilities ============
  - board: nice_nano
    shield: settings_reset
    artifact-name: settings_reset_nice_nano

  - board: xiao_ble/nrf52840/zmk
    shield: settings_reset
    artifact-name: settings_reset_xiao
